<style>
  /* Морская тема в духе Persona 3 Reload: глубина, циан, косые плашки, курсив капсом.
     Анимации только transform/opacity (дёшево для GPU) и выключаются при «уменьшить движение». */
  :root {
    --deep: #020b1f; --bg: #06122b; --card: #0b1f45; --border: #16407a; --field: #0a1838;
    --text: #eaf6ff; --muted: #7fa6d1; --accent: #1a9be0; --hilite: #5ee0ff;
    --green: #14b37d; --red: #e0405a; --orange: #f2a33a;
    --cut: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; color: var(--text);
    font: 15px/1.4 "Barlow Condensed", "Bahnschrift", "Roboto Condensed", "Arial Narrow", sans-serif; }
  body { background: linear-gradient(170deg, var(--deep) 0%, var(--bg) 45%, #0b3a86 100%) fixed; overflow-x: hidden; }

  /* Лучи света сквозь воду */
  .rays { position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(115deg, transparent 0 70px, rgba(120,220,255,.05) 70px 110px, transparent 110px 190px); }
  /* Волны внизу */
  .waves { position: fixed; left: 0; right: 0; bottom: 0; height: 90px; pointer-events: none; z-index: 0; overflow: hidden; }
  .waves svg { position: absolute; bottom: 0; width: 200%; height: 100%; animation: drift 14s linear infinite; }
  .waves svg + svg { animation-duration: 22s; opacity: .6; bottom: -10px; }
  @keyframes drift { to { transform: translateX(-50%); } }
  /* Пузыри */
  .bubble { position: fixed; bottom: -20px; border-radius: 50%; pointer-events: none; z-index: 0;
    border: 1.5px solid rgba(170,230,255,.45); background: radial-gradient(circle at 30% 30%, rgba(220,245,255,.35), transparent 45%);
    animation: rise linear infinite; }
  @keyframes rise { to { transform: translateY(-110vh) translateX(20px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .waves svg, .bubble { animation: none; } .bubble { display: none; } }

  main { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Шапка с косой циановой полосой */
  header { position: relative; padding: 18px 0 22px 4px; margin-bottom: 14px; }
  header::before { content: ""; position: absolute; left: -16px; right: 18%; top: 8px; bottom: 10px;
    background: rgba(26,155,224,.28); clip-path: polygon(0 0, 100% 0, calc(100% - 28px) 100%, 0 100%); }
  header::after { content: ""; position: absolute; left: -16px; right: calc(18% + 26px); bottom: 6px; height: 4px;
    background: var(--hilite); clip-path: polygon(0 0, 100% 0, calc(100% - 2px) 100%, 0 100%); }
  .title { position: relative; display: flex; align-items: center; gap: 10px; font-style: italic; text-transform: uppercase; }
  .title .gpo { font-size: 40px; font-weight: 800; line-height: .9; letter-spacing: 1px; }
  .title .sub { font-size: 17px; font-weight: 800; line-height: 1.05; }
  .title .sub span { color: var(--hilite); display: block; }
  .title .sub span.plain { color: inherit; }
  .pill { position: relative; display: inline-block; margin-top: 8px; padding: 2px 12px 2px 10px; font-size: 14px;
    font-weight: 800; font-style: italic; text-transform: uppercase; color: #fff; background: var(--muted);
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
  .pill::before { content: "● "; }
  .pill.on { background: var(--green); } .pill.off { background: var(--red); }
  .pill.away { background: var(--field); color: var(--muted); }

  /* Карточки и кнопки — скошенные углы */
  .slant { clip-path: polygon(var(--cut) 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat { position: relative; background: rgba(11,31,69,.92); padding: 10px 18px 8px; text-align: center; }
  .stat::before { content: ""; position: absolute; left: var(--cut); top: 0; width: 38%; height: 3px; background: var(--hilite); }
  .stat b { display: block; font-size: 34px; font-weight: 800; font-style: italic; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat span { color: var(--hilite); font-size: 14px; font-style: italic; text-transform: uppercase; letter-spacing: .5px; }

  .alarm { display: none; background: rgba(58,15,42,.95); border-left: 4px solid var(--red); padding: 12px 14px; margin-bottom: 12px; }
  .alarm.show { display: block; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .82; } }
  .alarm b { font-size: 20px; font-style: italic; text-transform: uppercase; }
  .alarm p { margin: 4px 0 10px; color: #ffb4c2; font-size: 16px; }

  button { width: 100%; border: 0; padding: 14px; font: inherit; font-size: 19px; font-weight: 800; font-style: italic;
    text-transform: uppercase; letter-spacing: .5px; color: #fff; background: var(--card); cursor: pointer;
    clip-path: polygon(var(--cut) 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%);
    transition: transform .08s, filter .15s, opacity .2s; }
  button:active { transform: scale(.97); filter: brightness(1.2); }
  button:disabled { opacity: .4; }
  .big { font-size: 26px; padding: 16px; margin-bottom: 8px; }
  .start { background: linear-gradient(100deg, var(--green), #0f9468); box-shadow: inset 0 -3px 0 var(--hilite); }
  .stop { background: linear-gradient(100deg, var(--red), #bf3149); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .row button { background: linear-gradient(100deg, #10306a, var(--card)); border-bottom: 2px solid var(--accent); }
  .danger { background: var(--red); }
  .fish { background: rgba(11,31,69,.92); padding: 10px 22px 12px; margin-bottom: 8px; }
  .fish h3 { margin: 0 0 6px; font-size: 18px; font-style: italic; text-transform: uppercase; color: var(--hilite); }
  .fish ol { list-style: none; margin: 0 0 10px; padding: 0; }
  .fish li { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 18px;
    border-bottom: 1px solid rgba(94,224,255,.12); }
  .fish li .name { flex: 1; font-weight: 700; }
  .fish li img, .fish li .noicon { width: 38px; height: 38px; background: #4f4f4f; object-fit: contain;
    border: 2px solid var(--muted); flex: none; }
  .fish .r-common .name { color: #e8eef5; } .fish .r-common img { border-color: #e8eef5; }
  .fish .r-rare .name { color: #4fd8ff; } .fish .r-rare img { border-color: #4fd8ff; }
  .fish .r-epic .name { color: #b48cff; } .fish .r-epic img { border-color: #b48cff; }
  /* Легендарная — название и рамка переливаются радугой */
  .fish .r-legendary .name { background: linear-gradient(90deg, #ff5f6d, #ffc371, #f9f871, #6bff9e, #4fd8ff, #b48cff, #ff5f6d);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rainbow 3s linear infinite; }
  .fish .r-legendary img { border-color: transparent; background:
      linear-gradient(#4f4f4f, #4f4f4f) padding-box,
      linear-gradient(90deg, #ff5f6d, #ffc371, #f9f871, #6bff9e, #4fd8ff, #b48cff, #ff5f6d) border-box;
    background-size: 100% 100%, 300% 100%; animation: rainbow 3s linear infinite; }
  @keyframes rainbow { to { background-position: 300% 0; } }
  @media (prefers-reduced-motion: reduce) { .r-legendary .name, .r-legendary img { animation: none; } }
  .fish li b { color: var(--hilite); font-style: italic; }
  .fish .empty { color: var(--muted); font-style: italic; }
  .meta { color: var(--muted); font-size: 14px; text-align: center; margin-top: 10px; font-style: italic; }
  .diag { color: var(--muted); opacity: .6; font-size: 11px; text-align: center; margin-top: 4px; word-break: break-word; }
  .card { background: rgba(11,31,69,.92); padding: 16px 22px; }
  .card h2 { font-size: 22px; font-style: italic; text-transform: uppercase; color: var(--hilite); margin: 0 0 6px; }
  .card p { color: var(--muted); margin: 0; font-size: 16px; }
  #toast { position: fixed; z-index: 5; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--accent); color: #fff; font-weight: 800; font-style: italic; padding: 10px 22px; transition: .25s;
    pointer-events: none; font-size: 16px; max-width: 90vw; text-align: center;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

    </div>

    <button id="toggle" class="big start" data-cmd="start">▶ Старт</button>
    <div class="row">

    </div>
    <div class="meta" id="meta">Ждём статус от ПК…</div>
    <div class="diag" id="diag"></div>
  </div>
</main>

      "Список улова придёт в чат с ботом": "A lista de capturas chegará no chat do bot",
      "Список улова очищен": "Lista de capturas limpa", "Команда отправлена": "Comando enviado",
      "Не удалось отправить: нет сети?": "Não foi possível enviar: sem rede?",
      "Остановить макрос?": "Parar a pesca?", "Очистить список улова?": "Limpar a lista de capturas?",
    },
  };
  const tgLang = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || "";
  let lang = "";
  function t(ru, vars) {
    let s = (I18N[lang] || {})[ru] || ru;
    if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
    return s;
  }
  function setLang(code) {
    code = String(code || "").slice(0, 2).toLowerCase();
    if (code !== "ru" && !I18N[code]) code = "en";
    if (code === lang) return false;
    lang = code;
    document.documentElement.lang = code;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    return true;
  }
  function sentText(cmd) {
    return t(cmd === "shot" ? "Скриншот придёт в чат с ботом"
      : cmd === "catches" ? "Список улова придёт в чат с ботом"
      : cmd === "reset_catches" ? "Список улова очищен" : "Команда отправлена");
  }
  setLang(hash.get("l") || tgLang || "en");
  const secret = hash.get("t");
  const server = (hash.get("s") || "https://ntfy.sh").replace(/\/+$/, "");
  if (!secret || !/^[A-Za-z0-9_-]{8,}$/.test(secret)) {
    $("setup").hidden = false;
    $("pill").textContent = t("Не настроено");
    return;
  }
  $("app").hidden = false;
  const statusTopic = `gpo-${secret}-status`;
  const cmdTopic = `gpo-${secret}-cmd`;
  const OFFLINE_AFTER = 75; // пока панель открыта, ПК шлёт статус раз в 15–30 с
  // Лимит бесплатного ntfy.sh ~250 сообщений в сутки, поэтому ПК шлёт статус только открытой панели:
  // панель раз в 30 с пишет ему «ping». Через 15 минут без касаний пинги на паузе — бережём лимит.
  const PING_EVERY = 30, WAIT_REPLY = 15, PAUSE_AFTER = 15 * 60;
  const pageStart = Date.now() / 1000;
  let lastPing = 0, activeSince = pageStart, paused = false, netError = false;

  // Основной канал — публичный MQTT-брокер: лимита сообщений нет, последний статус хранится на брокере.
  // Топик — хэш секрета, статус и команды подписаны HMAC секретом (брокер публичный).
  // Старые ссылки без «m» — брокеры по умолчанию (те же, что у макроса)
  const MQTT_DEFAULT = "wss://broker.emqx.io:8084/mqtt wss://broker.hivemq.com:8884/mqtt " +
    "wss://mqtt.eclipseprojects.io:443/mqtt wss://public:public@public.cloud.shiftr.io:443/";
  const mqttUrls = (hash.get("m") || MQTT_DEFAULT).split(/[\s,]+/).filter(Boolean);
  const links = [];   // {host, client, ok, err}
  let mqOk = false, hmacKey = null, mqBase = null, mqNote = "";
  const hex = buf => Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
  const enc = new TextEncoder();
  async function hmacHex(text) { return hex(await crypto.subtle.sign("HMAC", hmacKey, enc.encode(text))); }

  function mqState() {
    mqOk = links.some(l => l.ok);
    $("diag").textContent = mqNote || links.map(l => `${l.host}: ${l.ok ? "✓" : l.err ? "✗ " + l.err : "…"}`).join(" · ");
    render();
  }

  async function mqSend(cmd, only) {
    const t = Date.now(), n = hex(crypto.getRandomValues(new Uint8Array(8)));
    const msg = JSON.stringify({ c: cmd, t, n, h: await hmacHex(`${cmd}|${t}|${n}`) });
    // Одна и та же команда (тот же nonce) во все брокеры — ПК выполнит её один раз
    for (const l of (only ? [only] : links)) if (l.ok) l.client.publish(mqBase + "/c", msg, { qos: 1 });
  }

  async function startMqtt() {
    if (!mqttUrls.length) return;
    if (!window.mqtt) { mqNote = t("MQTT: не загрузилась библиотека"); mqState(); return; }
    if (!window.crypto || !crypto.subtle) { mqNote = t("MQTT: нет WebCrypto в этом браузере"); mqState(); return; }
    try {
      hmacKey = await crypto.subtle.importKey("raw", enc.encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
      mqBase = "gpo/" + hex(await crypto.subtle.digest("SHA-256", enc.encode("gpo-topic:" + secret))).slice(0, 40);
    } catch (e) { mqNote = "MQTT: " + e.message; mqState(); return; }
    for (const url of mqttUrls) {
      let host = url, plain = url;
      const opts = { clientId: "gpo-tg-" + hex(crypto.getRandomValues(new Uint8Array(6))),
                     reconnectPeriod: 4000, connectTimeout: 10000, clean: true };
      try {
        const u = new URL(url);
        host = u.hostname.replace(/^(broker|mqtt|public)\./, "") + ":" + (u.port || "443");
        if (u.username) { opts.username = decodeURIComponent(u.username); opts.password = decodeURIComponent(u.password); }
        u.username = ""; u.password = "";
        plain = u.toString();
      } catch (e) {}
      const l = { host, ok: false, err: "" };
      links.push(l);
      l.client = mqtt.connect(plain, opts);
      l.client.on("connect", () => {
        l.ok = true; l.err = ""; netError = false;
        l.client.subscribe(mqBase + "/s", { qos: 1 });
        mqSend("ping", l).catch(() => {});   // ПК сразу пришлёт свежий статус
        mqState();
      });
      l.client.on("error", e => { l.err = (e && e.message) || t("ошибка"); mqState(); });
      l.client.on("close", () => { if (l.ok || !l.err) { l.ok = false; l.err = l.err || t("нет соединения"); mqState(); } });
      l.client.on("message", async (topic, payload, packet) => {
        try {
          const m = JSON.parse(new TextDecoder().decode(payload));
          if ((await hmacHex(m.d)) !== m.h) return;          // не от нашего ПК
          const s = JSON.parse(m.d);
          // Живое сообщение — время по часам телефона (часы ПК могут спешить); сохранённое на брокере — по ПК
          if (!packet.retain) s.ts = Date.now() / 1000;
          setStatus(s);
        } catch (e) {}
      });
    }
    mqState();
  }

  let status = null;
  let fetched = false;
  // Время старта по часам телефона. Один статус приходит несколькими путями с разной задержкой —
  // если пересчитывать время от каждого, оно скачет вперёд-назад. Поправляем, только если разошлось > 5 с
  let runStart = null;

  function setStatus(s) {
    if (status && s.ts < status.ts) return;           // устаревший статус
    if (s.lang) setLang(s.lang);                        // язык — как в программе на ПК
    if (!s.running) runStart = null;
    else {
      const est = s.ts - s.runtime;
      if (runStart === null || Math.abs(est - runStart) > 5) runStart = est;
    }
    status = s;
    render();
  }
  let toastTimer = null;

  function toast(text) {
    $("toast").textContent = text;
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2200);
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function render() {
    const now = Date.now() / 1000;
    const online = status && now - status.ts < OFFLINE_AFTER;
    const pill = $("pill");
    const waiting = !paused && (now - lastPing < WAIT_REPLY || now - pageStart < WAIT_REPLY);
    if (!status) {
      const away = fetched && !waiting;
      pill.className = "pill away"; pill.textContent = away ? t("ПК не в сети") : t("Подключение…");
      $("meta").textContent = netError ? t("Нет связи с ntfy.sh — проверьте интернет или VPN")
        : paused ? t("Обновление на паузе — коснитесь экрана")
        : away ? t("Запустите макрос на ПК — статус появится сам") : t("Ждём статус от ПК…");
    } else if (!online && waiting) {
      pill.className = "pill away"; pill.textContent = t("Подключение…");
    } else if (!online) {
      pill.className = "pill away"; pill.textContent = t("ПК не в сети");
    } else if (status.running) {
      pill.className = "pill on"; pill.textContent = status.state || t("Работает");
    } else {
      pill.className = "pill off"; pill.textContent = status.state || t("Остановлен");
    }
    document.querySelectorAll("button").forEach(b => b.disabled = !online);
    if (!status) return;

    const runtime = status.running && runStart !== null ? now - runStart : status.runtime;
    $("catches").textContent = status.catches;
    $("casts").textContent = status.casts;
    $("runtime").textContent = fmtTime(runtime);
    $("rate").textContent = runtime >= 60 ? Math.round(status.catches * 3600 / runtime) : "0";

    const toggle = $("toggle");
    toggle.className = "big " + (status.running ? "stop" : "start");
    toggle.textContent = status.running ? t("■ Стоп") : t("▶ Старт");
    toggle.dataset.cmd = status.running ? "stop" : "start";

    const scr = $("screen");
    scr.textContent = status.blackout ? t("🔆 Вкл. экран") : t("🌑 Погасить");
    scr.dataset.cmd = status.blackout ? "screen_on" : "screen_off";

    const list = $("fishList");
    list.replaceChildren();
    const fish = status.fish || [];
    if (!fish.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = status.fish_log === false
        ? t("Список улова выключен — включите в программе: Улов → Вести список улова")
        : t("Пока ничего не поймано");
      list.append(li);
    }
    for (const f of fish) {
      const li = document.createElement("li");
      if (["common", "rare", "epic", "legendary"].includes(f.rarity)) li.className = "r-" + f.rarity;
      let icon;
      if (f.id && /^[0-9]+$/.test(f.id)) {  // выученные на ПК рыбы (u001…) иконки на сайте не имеют
        icon = document.createElement("img");
        icon.src = `fish/${f.id}.png`;
        icon.alt = "";
      } else {
        icon = document.createElement("span");
        icon.className = "noicon";
      }
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = f.name;
      const count = document.createElement("b");
      count.textContent = "× " + f.count;
      li.append(icon, name, count);
      list.append(li);
    }

    $("alarm").classList.toggle("show", !!status.alarm);
    $("alarmText").textContent = status.alarm || "";
    const ago = Math.max(0, Math.round(now - status.ts));
    $("meta").textContent = netError ? t("Нет связи с ntfy.sh — проверьте интернет или VPN")
      : paused ? t("Обновление на паузе — коснитесь экрана · статус {ago} назад", {ago: fmtTime(ago)})
      : online ? t("Обновлено {ago} с назад", {ago}) : t("Последний статус {ago} назад", {ago: fmtTime(ago)});
  }

  function accept(msg) {
    if (!msg || msg.event !== "message") return;
    netError = false;
    try {
      const s = JSON.parse(msg.message);
      // Время берём с сервера ntfy, а не с часов ПК: если часы ПК спешат или отстают,
      // панель иначе решала бы, что ПК «не в сети»
      if (msg.time) s.ts = msg.time;
      setStatus(s);
    } catch (e) {}
  }

  async function send(cmd) {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
    try {
      if (mqOk) {
        await mqSend(cmd);
        toast(sentText(cmd));
        return;
      }
      const r = await fetch(`${server}/${cmdTopic}`, { method: "POST", body: cmd });
      if (!r.ok) throw new Error(r.status);
      toast(sentText(cmd));
    } catch (e) {
      toast(t("Не удалось отправить: нет сети?"));
    }
  }

  async function ping() {
    const now = Date.now() / 1000;
    if (document.hidden) return;
    if (mqOk) { paused = false; return; }   // по MQTT статус идёт сам, лимита нет
    if (now - activeSince > PAUSE_AFTER) { paused = true; render(); return; }
    lastPing = now;
    try {
      const r = await fetch(`${server}/${cmdTopic}`, { method: "POST", body: "ping" });
      netError = !r.ok && r.status !== 429;
    } catch (e) {
      netError = true;
    }
    render();
  }

  function wake() {
    activeSince = Date.now() / 1000;
    if (paused) { paused = false; ping(); }
  }
  document.addEventListener("pointerdown", wake);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { wake(); ping(); } });
  setInterval(ping, PING_EVERY * 1000);
  startMqtt().finally(() => setTimeout(ping, mqttUrls.length ? 4000 : 0));   // ntfy — если брокер не ответил

  document.addEventListener("click", e => {
    const b = e.target.closest("button[data-cmd]");
    if (!b || b.disabled) return;
    if (b.dataset.cmd === "stop" && tg && tg.showConfirm) {
      tg.showConfirm(t("Остановить макрос?"), ok => ok && send("stop"));
    } else if (b.dataset.cmd === "reset_catches") {
      const ask = t("Очистить список улова?");
      if (tg && tg.showConfirm) tg.showConfirm(ask, ok => ok && send("reset_catches"));
      else if (confirm(ask)) send("reset_catches");
    } else {
      send(b.dataset.cmd);
    }
  });

  // Последний статус (ПК шлёт его минимум раз в 30 с, так что хватает 2 минут), затем живой поток
  fetch(`${server}/${statusTopic}/json?poll=1&since=2m`)
    .then(r => r.text())
    .then(t => t.trim().split("\n").filter(Boolean).forEach(l => { try { accept(JSON.parse(l)); } catch (e) {} }))
    .catch(() => { netError = true; })
    .finally(() => { fetched = true; render(); });

  function listen() {
    const es = new EventSource(`${server}/${statusTopic}/sse`);
    es.onmessage = ev => { try { accept(JSON.parse(ev.data)); } catch (e) {} };
    es.onerror = () => { es.close(); setTimeout(listen, 3000); };
  }
  listen();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
