name: Build FishPilot

# Сборка и тесты — на каждый push (без права записи в репозиторий).
# Релиз для пользователей — ТОЛЬКО по тегу vX.Y.Z или ручному запуску (Actions → Run workflow → publish):
# отдельная задача publish, у которой одной есть право писать релизы.
on:
  push:
    branches:
      - "**"
    paths-ignore:            # мини-приложение (GitHub Pages) и тексты сборку не трогают
      - "index.html"
      - "fish/**"
      - "vendor/**"
      - "**.md"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать релиз для пользователей"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3 pytest pip-licenses==5.0.0
      - name: Test
        timeout-minutes: 10
        run: python -m pytest -q -rs -s tests
      - name: Version
        id: version
        shell: pwsh
        run: |
          $ver = python -c "import macro; print(macro.__version__)"
          "version=$ver" >> $env:GITHUB_OUTPUT
      - name: Version resource and licenses
        run: |
          python tools/build_meta.py version build\version.txt
          python tools/build_meta.py licenses build\THIRD_PARTY_LICENSES.txt
      # Папка (FishPilot.exe + _internal): быстрее запускается и реже пугает антивирусы, чем один exe
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --onedir --windowed --noupx --name FishPilot
          --version-file build\version.txt --icon assets\icon.ico --add-data "assets;assets"
          --collect-data customtkinter --collect-all winrt gpo_macro.py
      - name: Self-test (Windows OCR inside the build)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FishPilot\FishPilot.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist\FishPilot\selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest failed" }
          Remove-Item dist\FishPilot\selftest.txt
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item LICENSE dist\FishPilot\LICENSE.txt
          Copy-Item build\THIRD_PARTY_LICENSES.txt dist\FishPilot\
          Copy-Item README.md dist\FishPilot\README.md
          Compress-Archive -Path dist\FishPilot -DestinationPath dist\FishPilot-win64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: FishPilot
          path: dist/FishPilot-win64.zip

  # macOS (Apple Silicon): FishPilot.app в FishPilot-macos.zip. Подпись — ad-hoc (платной подписи Apple нет)
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3 pytest pip-licenses==5.0.0
      - name: Test
        timeout-minutes: 10
        run: python -m pytest -q -rs -s tests
      - name: Icon and licenses
        run: |
          mkdir -p build
          python -c "from PIL import Image; Image.open('assets/icon.ico').save('build/icon.icns')"
          python tools/build_meta.py licenses build/THIRD_PARTY_LICENSES.txt
      - name: Build app
        run: >
          python -m PyInstaller --noconfirm --windowed --name FishPilot --icon build/icon.icns
          --osx-bundle-identifier com.santw3.fishpilot --add-data "assets:assets"
          --collect-data customtkinter gpo_macro.py
      - name: Version in Info.plist
        run: |
          ver=$(python -c "import macro; print(macro.__version__)")
          plist=dist/FishPilot.app/Contents/Info.plist
          plutil -replace CFBundleShortVersionString -string "$ver" "$plist"
          plutil -replace CFBundleVersion -string "$ver" "$plist"
          plutil -replace LSMinimumSystemVersion -string "12.0" "$plist"
          codesign --force --deep --sign - dist/FishPilot.app
          codesign --verify --deep --strict dist/FishPilot.app
      - name: Self-test (Apple Vision OCR inside the app)
        run: |
          FISHPILOT_SELFTEST_DIR="$RUNNER_TEMP" dist/FishPilot.app/Contents/MacOS/FishPilot --selftest; code=$?
          cat "$RUNNER_TEMP/selftest.txt"
          test $code -eq 0
      # Настоящий запуск окна: программа должна прожить 20 с (selftest окно не открывает)
      - name: Launch smoke test
        run: |
          rm -rf ~/Library/Logs/DiagnosticReports/FishPilot* 2>/dev/null || true
          dist/FishPilot.app/Contents/MacOS/FishPilot > "$RUNNER_TEMP/out.txt" 2>&1 &
          pid=$!
          sleep 20
          alive=0; kill -0 $pid 2>/dev/null && alive=1
          kill $pid 2>/dev/null || true
          echo "--- stdout/stderr"; cat "$RUNNER_TEMP/out.txt"
          echo "--- app log"; cat ~/Library/Application\ Support/FishPilot/logs/fishpilot.log 2>/dev/null || true
          for f in ~/Library/Logs/DiagnosticReports/FishPilot*; do [ -f "$f" ] && { echo "--- $f"; head -120 "$f"; }; done
          test $alive -eq 1
          grep -q "macOS hotkeys: NSEvent monitors" ~/Library/Application\ Support/FishPilot/logs/fishpilot.log
      - name: Zip
        run: |
          mkdir -p dist/pkg/FishPilot
          ditto dist/FishPilot.app dist/pkg/FishPilot/FishPilot.app
          cp LICENSE dist/pkg/FishPilot/LICENSE.txt
          cp build/THIRD_PARTY_LICENSES.txt README.md dist/pkg/FishPilot/
          ditto -c -k --keepParent dist/pkg/FishPilot dist/FishPilot-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FishPilot-macos
          path: dist/FishPilot-macos.zip

  # Релиз vX.Y.Z, помеченный latest — программа проверяет releases/latest.
  # Сначала черновик с файлом, потом публикация: программа не увидит версию раньше файла.
  publish:
    needs: [build, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VER: ${{ needs.build.outputs.version }}
    steps:
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "${GITHUB_REF_NAME}" = "v$VER" || { echo "Тег ${GITHUB_REF_NAME} не совпадает с версией $VER"; exit 1; }
      - name: Version not released yet
        run: |
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Релиз v$VER уже есть — поднимите __version__ в macro/__init__.py"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: FishPilot
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: FishPilot-macos
          path: dist
      - name: Publish release
        run: |
          zsha=$(sha256sum dist/FishPilot-win64.zip | cut -d' ' -f1)
          msha=$(sha256sum dist/FishPilot-macos.zip | cut -d' ' -f1)
          # latest.json — программа проверяет обновления по нему (обычная ссылка, без лимита API GitHub)
          printf '{"version":"%s","assets":{"win":{"name":"FishPilot-win64.zip","sha256":"%s","size":%s},"mac":{"name":"FishPilot-macos.zip","sha256":"%s","size":%s}}}\n' \
            "$VER" "$zsha" "$(stat -c%s dist/FishPilot-win64.zip)" "$msha" "$(stat -c%s dist/FishPilot-macos.zip)" > dist/latest.json
          cat dist/latest.json
          notes=$(printf '%s\n\n%s\n\nversion: %s\nzip_sha256: %s\nmac_zip_sha256: %s\ncommit: %s' \
            "**Windows:** download FishPilot-win64.zip, unpack it and run FishPilot.exe. **macOS (Apple Silicon):** download FishPilot-macos.zip, unpack it, move FishPilot.app to Applications and see the README for first launch. Installed copies update themselves." \
            "Free, MIT license. Not affiliated with Roblox or Grand Piece Online; automating the game may break its rules — use at your own risk." \
            "$VER" "$zsha" "$msha" "$GITHUB_SHA")
          gh release create "v$VER" dist/FishPilot-win64.zip dist/FishPilot-macos.zip dist/latest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "FishPilot $VER" --notes "$notes" --draft
          gh release edit "v$VER" --repo "$GITHUB_REPOSITORY" --draft=false --latest
